name: Build and publish joke-platform images

on:
  push:
    branches:
      - main
    paths:
      - "joke-platform/**"
      - ".github/workflows/build-and-publish.yaml"
  workflow_dispatch: {}

env:
  REGISTRY: ${{ vars.HARBOR_REGISTRY || 'harbor.container.it-scholar.com' }}
  REGISTRY_PROJECT: joke-platform

jobs:
  build-and-push:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - joke-gateway
          - joke-generator
          - punchline-service
          - audience-service
          - chaos-comedian

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: joke-platform
          file: joke-platform/infrastructure/docker/Dockerfile.spring-service
          build-args: |
            MODULE=${{ matrix.service }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REGISTRY_PROJECT }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

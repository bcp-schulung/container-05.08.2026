{{- if .Values.services.jokeGateway.enabled }}
{{- $svc := .Values.services.jokeGateway }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "joke-platform.serviceLabels" (list $svc $) | nindent 4 }}
spec:
  type: {{ $svc.service.type }}
  ports:
  - port: {{ $svc.service.port }}
    targetPort: http
    protocol: TCP
    name: http
    {{- if and (eq $svc.service.type "NodePort") $svc.service.nodePort }}
    nodePort: {{ $svc.service.nodePort }}
    {{- end }}
  selector:
    {{- include "joke-platform.serviceSelectorLabels" (list $svc) | nindent 4 }}
{{- end }}

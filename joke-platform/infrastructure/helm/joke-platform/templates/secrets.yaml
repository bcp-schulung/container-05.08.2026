{{- if not .Values.rabbitmq.auth.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: joke-platform
type: Opaque
stringData:
  username: {{ .Values.rabbitmq.auth.username | quote }}
  password: {{ .Values.rabbitmq.auth.password | quote }}
{{- end }}
{{- if not .Values.redis.auth.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: joke-platform
type: Opaque
stringData:
  password: {{ .Values.redis.auth.password | quote }}
{{- end }}
{{- if .Values.cnpg.bootstrap.createSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.cnpg.bootstrap.existingSecret }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.cnpg.clusterName }}
    app.kubernetes.io/part-of: joke-platform
type: Opaque
stringData:
  username: {{ .Values.cnpg.bootstrap.owner | quote }}
  password: {{ .Values.cnpg.bootstrap.password | quote }}
{{- end }}

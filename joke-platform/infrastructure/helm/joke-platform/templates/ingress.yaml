{{- if .Values.ingress.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: joke-platform-gateway
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: joke-platform
    app.kubernetes.io/part-of: joke-platform
spec:
  gatewayClassName: {{ .Values.ingress.gatewayClassName }}
  {{- if .Values.ingress.proxyProtocol }}
  infrastructure:
    annotations:
      load-balancer.hetzner.cloud/uses-proxyprotocol: "true"
  {{- end }}
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    hostname: {{ .Values.ingress.hostname | quote }}
  {{- if .Values.ingress.tls.enabled }}
  - name: https
    protocol: HTTPS
    port: 443
    hostname: {{ .Values.ingress.hostname | quote }}
    tls:
      mode: Terminate
      certificateRefs:
      - name: {{ .Values.ingress.tls.secretName }}
        kind: Secret
  {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: joke-platform
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: joke-platform
    app.kubernetes.io/part-of: joke-platform
spec:
  parentRefs:
  - name: joke-platform-gateway
    namespace: {{ .Values.global.namespace }}
  hostnames:
  - {{ .Values.ingress.hostname | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ .Values.services.jokeGateway.name }}
      port: {{ .Values.services.jokeGateway.service.port }}
{{- if .Values.ingress.tls.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.ingress.tls.secretName }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: joke-platform
    app.kubernetes.io/part-of: joke-platform
spec:
  secretName: {{ .Values.ingress.tls.secretName }}
  issuerRef:
    name: {{ .Values.ingress.tls.issuerName }}
    kind: {{ .Values.ingress.tls.issuerKind }}
  dnsNames:
  - {{ .Values.ingress.hostname | quote }}
{{- end }}
{{- end }}

# Default values for joke-platform
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global settings
global:
  namespace: joke-platform
  imageRegistry: harbor.container.it-scholar.com
  imagePullPolicy: IfNotPresent

# Namespace management
namespace:
  create: true

# Service-specific configurations
services:
  jokeGateway:
    enabled: true
    name: joke-gateway
    component: gateway
    replicaCount: 2
    image:
      repository: seminar/joke-gateway
      tag: v1
    service:
      type: NodePort
      port: 8080
      nodePort: 30080
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
    config:
      backendConnectTimeoutMs: 2000
      backendReadTimeoutMs: 7000
      thymeleafCache: true

  jokeGenerator:
    enabled: true
    name: joke-generator
    replicaCount: 2
    image:
      repository: seminar/joke-generator
      tag: v1
    service:
      type: ClusterIP
      port: 8081
    resources:
      requests:
        cpu: 250m
        memory: 384Mi
      limits:
        cpu: 500m
        memory: 768Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70
    config:
      repositoryProvider: database
      dbHost: joke-platform-db-rw
      dbPort: 5432
      dbName: joke-platform
      dbUsername: jokes
      dbExistingSecret: postgres-credentials

  punchlineService:
    enabled: true
    name: punchline-service
    replicaCount: 2
    image:
      repository: seminar/punchline-service
      tag: v1
    service:
      type: ClusterIP
      port: 8082
    resources:
      requests:
        cpu: 250m
        memory: 384Mi
      limits:
        cpu: 500m
        memory: 768Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70
    config:
      repositoryProvider: database
      dbHost: joke-platform-db-rw
      dbPort: 5432
      dbName: joke-platform
      dbUsername: jokes
      dbExistingSecret: postgres-credentials

  audienceService:
    enabled: true
    name: audience-service
    replicaCount: 2
    image:
      repository: seminar/audience-service
      tag: v1
    service:
      type: ClusterIP
      port: 8083
    resources:
      requests:
        cpu: 250m
        memory: 384Mi
      limits:
        cpu: 500m
        memory: 768Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70
    config:
      statisticsProvider: database
      eventsEnabled: true
      redisHealthEnabled: true
      dbHost: joke-platform-db-rw
      dbPort: 5432
      dbName: joke-platform
      dbUsername: jokes
      dbExistingSecret: postgres-credentials

  chaosComedian:
    enabled: true
    name: chaos-comedian
    replicaCount: 1
    image:
      repository: seminar/chaos-comedian
      tag: v1
    service:
      type: ClusterIP
      port: 8084
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 250m
        memory: 512Mi
    autoscaling:
      enabled: false

# Redis configuration
redis:
  enabled: true
  image:
    repository: redis
    tag: 7.2-alpine
  service:
    port: 6379
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  config:
    maxmemory: "256mb"
    maxmemoryPolicy: "allkeys-lru"
  auth:
    password: redis-platform-secret
    existingSecret: ""

# RabbitMQ configuration
rabbitmq:
  enabled: true
  image:
    repository: rabbitmq
    tag: 3.13-management-alpine
  service:
    amqpPort: 5672
    managementPort: 15672
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""
  auth:
    username: jokes
    password: jokes-platform-secret
    existingSecret: ""

# CloudNativePG configuration
cnpg:
  enabled: true
  clusterName: joke-platform-db
  instances: 1
  image:
    repository: ghcr.io/cloudnative-pg/postgresql
    tag: "16.4"
  bootstrap:
    database: joke-platform
    owner: jokes
    password: jokes-platform-secret
    existingSecret: postgres-credentials
    createSecret: true
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  affinity:
    enablePodAntiAffinity: false

# Ingress configuration (uses the Gateway API, since the cluster's Cilium
# install is configured as a Gateway controller rather than a classic Ingress
# controller). Disabled by default in favor of exposing joke-gateway directly
# via a NodePort service (see services.jokeGateway.service above).
ingress:
  enabled: false
  gatewayClassName: cilium
  hostname: jokes.container.it-scholar.com
  # The cluster's Cilium install has enable-gateway-api-proxy-protocol=true,
  # so the Hetzner LB backing the Gateway must be told to speak PROXY protocol.
  proxyProtocol: true
  tls:
    enabled: true
    secretName: joke-platform-tls
    issuerName: joke-platform-selfsigned
    issuerKind: ClusterIssuer
    # Creates a self-signed ClusterIssuer so TLS works out of the box without
    # requiring a pre-existing ACME/letsencrypt ClusterIssuer. Set to false and
    # point issuerName/issuerKind at your own issuer if you have one.
    createSelfSignedIssuer: true

# Network Policy
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress

# Monitoring
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    path: /actuator/prometheus

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1
